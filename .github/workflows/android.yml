name: OptiBoost APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optiboost-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Gradle wrapper check
        run: chmod +x gradlew && ./gradlew --version

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Rename artifacts
        run: |
          mkdir -p dist
          release_apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$release_apk" dist/optiboost-v1.0.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/optiboost-debug.apk
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: optiboost-apk-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*.apk
